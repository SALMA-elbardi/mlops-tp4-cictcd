data:
  test_size: 0.25
  random_state: 42

model:
  max_features: 5000
  ngram_range: [1, 2]
  C: 1.0
  max_iter: 1000

quality_gate:
  min_accuracy: 0.60
  min_f1: 0.50
  max_regression: 0.05
  min_coverage: 70

training:
  experiment_name: "sentiment-classification"
  model_name: "sentiment-model"